rules:
  # 1. 本地 DNS 流量劫持
  - "AND,((DST-PORT,53),(IP-CIDR,8.8.8.8/32,no-resolve)),dns-out"
  - "AND,((DST-PORT,53),(IP-CIDR,8.8.4.4/32,no-resolve)),dns-out"

  # 2. 个人私有网络及穿透
  - "RULE-SET,personal-proxy,📲 个人服务"
  - "RULE-SET,personal,🎯 全球直连"
  - "RULE-SET,private,🎯 全球直连"
  - "GEOIP,private,🎯 全球直连,no-resolve"

  # 3. 下载客户端直连（前置防 BT 跑代理封号）
  - "RULE-SET,download,🎯 全球直连"

  # 4. 广告拦截
  - "RULE-SET,category-ads-all,🛑 广告拦截"

  # 5. 第一层：国内常用大厂与国内游戏优先直连
  - "RULE-SET,geolocation-cn,🔒 国内服务"
  - "RULE-SET,cn-ip,🔒 国内服务,no-resolve"
  - "RULE-SET,games-cn,🎯 全球直连"

  # 6. AI 服务
  - "RULE-SET,openai,🤖 AI 服务"
  - "RULE-SET,anthropic,🤖 AI 服务"
  - "RULE-SET,category-ai-chat-!cn,🤖 AI 服务"

  # 7. 谷歌推送通道
  - "RULE-SET,google-fcm,📢 谷歌FCM"

  # 8. 核心流媒体与社交
  - "RULE-SET,youtube,📹 油管视频"
  - "RULE-SET,netflix,🎥 奈飞视频"
  - "RULE-SET,netflix-ip,🎥 奈飞视频,no-resolve"
  - "RULE-SET,bahamut,📺 巴哈姆特"
  - "GEOSITE,bilibili@!cn,📺 哔哩港澳台"
  - "RULE-SET,bilibili,📺 哔哩哔哩"
  - "RULE-SET,google,🔍 谷歌服务"
  - "RULE-SET,google-ip,🔍 谷歌服务,no-resolve"
  - "RULE-SET,telegram,📲 电报消息"
  - "RULE-SET,telegram-ip,📲 电报消息,no-resolve"

  # 9. 代码托管（GitHub / GitLab / Bitbucket）
  - "RULE-SET,github,🐱 代码托管"
  - "RULE-SET,gitlab,🐱 代码托管"
  - "RULE-SET,atlassian,🐱 代码托管"

  # 10. 微软、苹果、海外游戏
  - "RULE-SET,onedrive,Ⓜ️ 微软服务"
  - "RULE-SET,microsoft,Ⓜ️ 微软服务"
  - "RULE-SET,icloud,🍏 苹果服务"
  - "RULE-SET,apple,🍏 苹果服务"
  - "RULE-SET,games,🎮 游戏平台"

  # 11. 海外常用域名快速命中代理
  - "RULE-SET,geolocation-!cn,🚀 节点选择"

  # 12. 第二层：完整中国大陆域名及 IP 兜底直连
  - "RULE-SET,cn-domain,🔒 国内服务"
  - "GEOIP,CN,🔒 国内服务"

  # 13. 最终兜底：未收录的海外流量走节点
  - "MATCH,🐟 漏网之鱼"
