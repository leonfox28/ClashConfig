    - "+.huyuanzhe.family"
    - "+.mynetname.net"
    - "+.zenithconsulting.cn"
    - "+.iroh.link"
    - "+.relay.zedra.dev"
    - "proariaden927861.exzxwmrbnedyoldwod.com"
    - "+.lan"
    - "+.local"
    - "*.localhost"
    - "*.home.arpa"
    - "*.localdomain"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "captive.apple.com"
